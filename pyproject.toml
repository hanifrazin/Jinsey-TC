[project]
name = "jinsey"
version = "0.1.0"
description = "Local Jinja2 test case authoring and YAML/Excel export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.2,<7",
    "openpyxl>=3.1.5,<4",
    "filelock>=3.20,<4",
]

[project.scripts]
jinsey = "jinsey.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
